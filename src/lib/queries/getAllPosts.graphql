query GetAllPosts {
    posts(first: 10000) {
      edges {
        node {
          slug
          excerpt
				  title
          date
          categories {
            edges {
              node {
                name
              }
            }
          }
          tags {
            edges {
              node {
                name
              }
            }
          }
          featuredImage {
            node {
              sourceUrl
              altText
              mediaDetails {
                sizes {
                  name
                  sourceUrl
                  width
                  height
                }
              }
            }
          }
          content
        }
      }
    }
  }